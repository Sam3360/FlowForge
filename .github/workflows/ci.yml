name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Engine tests
        working-directory: engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
      - name: Shared node definitions are up to date
        working-directory: engine
        run: python -m flowforge_engine.export_definitions ../shared/node-definitions.json && git diff --exit-code ../shared
      - name: Frontend typecheck and tests
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
        env: { FLOWFORGE_PYTHON: python }

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Build and smoke-test the Windows sidecar
        working-directory: engine
        run: |
          python -m pip install -e ".[dev]"
          python build_sidecar.py
          python smoke_sidecar.py ../app/src-tauri/binaries/flowforge-engine-x86_64-pc-windows-msvc.exe
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: app/src-tauri/target/release/bundle/nsis/*.exe
