# Linux-only on purpose: no Windows runners are used here (they are billed separately).
# The Windows sidecar + installer are built manually on a Windows PC; see docs/RELEASE.md.
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Engine tests
        working-directory: engine
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
      - name: Shared node definitions are up to date
        working-directory: engine
        run: python -m flowforge_engine.export_definitions ../shared/node-definitions.json && git diff --exit-code ../shared
      - name: Frontend typecheck, tests, build
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env: { FLOWFORGE_PYTHON: python }
