[project]
name = "flowforge-engine"
version = "0.1.0"
description = "FlowForge workflow execution engine (NDJSON sidecar)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowforge_engine*"]
